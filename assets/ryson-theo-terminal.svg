    <text class="ascii" x="0" y="50">▄ ▄▄░┌──── ▄▄ ▄▄ ░└┐  ▄ ▄▄░│ ▄ ▄▄░└─────── ▄▄ ▄▄░│ ▄ ▄▄░│ ▄ ▄▄░│         ▄ ▄▄░│      ▄ ▄▄░┌─────── ▄ ▄ └┐      ▄ ▄▄░┌──── ▄▄ ▄▄ ░└┐  ▄ ▄▄ ▄ ┐      ▄▄ ▄▄░│     └────── ▄ ▄▄ ▄░│</text>

