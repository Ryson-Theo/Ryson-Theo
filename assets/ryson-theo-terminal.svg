  </g>


  <!-- =====================================================
       DESCRIPTION COMMAND
       ===================================================== -->

  <g transform="translate(28 185)">

    <text
      class="prompt"
      x="0"
      y="0"
    >Ryson-Theo@github</text>

    <text
      class="path"
      x="166"
      y="0"
    >:~ $</text>

    <text
      class="command"
      x="215"
      y="0"
