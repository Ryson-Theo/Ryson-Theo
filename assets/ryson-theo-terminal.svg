    >▄ ▄▄░┌───────  ▄ ▄▄░│ ▄ ▄▄░│ ▄ ▄▄░└───────  ▄ ▄▄ ┐ ▄ ▄▄░│ ▄ ▄▄░┌──────── ▄ ▄▄░│      ▄ ▄▄░│         ▄ ▄▄░│      ▄ ▄▄░┌───────  ▄ ▄▄░│ ▄ ▄▄ ░┌──────  ▄ ▄▄░│ ▄ ▄▄ ▄        ▄▄ ▄░│</text>

    <text
      class="ascii"
      x="0"
      y="30"
    >▀ ▀▀ └        ▀▀ ▀▀░│ ▀ ▀▀░│ ▀ ▀▀ ▀▀ ▀▀ ▀▀ ▀▀ ▀░┌┘ ▀ ▀▀░│ ▀ ▀▀░│         ▀ ▀▀░│      ▀ ▀▀ └      ▀ ▀▀ ▀ ┌┘      ▀ ▀▀ └        ▀▀ ▀▀░│ ▀ ▀▀ ░│        ▀ ▀▀░│   ▀▀ ▀▀ ▀▀ ▀▀ ▀▀ ▀░│</text>

    <text
