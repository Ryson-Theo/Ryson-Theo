    <text
      class="ascii"
      x="0"
      y="70"
    >▀ ▀▀░│        ▀▀ ▀▀░│ ▀ ▀▀░│ ▀ ▀▀ ▀▀ ▀▀ ▀▀ ▀▀░┌─┘  ▀ ▀▀░│ ▀ ▀▀░│         ▀ ▀▀░│      ▀ ▀▀░│         ▀ ▀▀░│      ▀ ▀▀░│        ▀▀ ▀▀░│  └ ▀ ▀▀ ▀▀ ▀▀ ▀░┌─┘   ▀ ▀▀ ▀▀ ▀▀ ▀▀ ▀░┌──┘</text>

    <text
      class="ascii"
      x="0"
      y="80"
    >  └──┘          └───┘  └───┘   └──────────────┘     └───┘   └──┘           └──┘        └──┘          └───┘        └──┘          └───┘     └───────────┘       └─────────────┘</text>

  </g>


  <!-- =====================================================
       ONE-LINE PROFILE DESCRIPTION
       DIRECTLY BELOW ASCII NAME
       ===================================================== -->

  <text
    class="description"
    x="600"
    y="193"
    text-anchor="middle"
  >
    <tspan class="description-accent">AI/ML Integration</tspan>
    <tspan fill="#484f58"> · </tspan>
    <tspan class="description-accent">Scalable APIs</tspan>
    <tspan fill="#484f58"> · </tspan>
    <tspan class="description-accent">Intelligent Systems</tspan>
    <tspan fill="#484f58"> — </tspan>
    <tspan>Specializing in AI/ML integration, scalable APIs, and intelligent systems across stacks.</tspan>
  </text>


  <!-- =====================================================
       EMPTY TERMINAL SHELL
       ===================================================== -->

  <g transform="translate(28 252)">

    <text
      class="prompt"
      x="0"
      y="0"
    >Ryson-Theo@github</text>

    <text
      class="path"
      x="166"
      y="0"
    >:~ $</text>

    <!-- Empty command line -->
    <rect
      class="cursor"
      x="215"
      y="-13"
      width="8"
      height="16"
      rx="1"
    />

  </g>


  <!-- =====================================================
       SUBTLE CRT SCREEN FLICKER
       ===================================================== -->

  <rect
    x="2"
    y="2"
    width="1196"
    height="296"
    rx="11"
    fill="#58a6ff"
    class="screen-flicker"
    pointer-events="none"
  />

</svg>
