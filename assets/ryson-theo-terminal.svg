    <text class="ascii" x="0" y="70">▀ ▀▀░│        ▀▀ ▀▀░│ ▀ ▀▀░│ ▀ ▀▀ ▀▀ ▀▀ ▀▀ ▀▀░┌─┘  ▀ ▀▀░│ ▀ ▀▀░│         ▀ ▀▀░│      ▀ ▀▀░│         ▀ ▀▀░│      ▀ ▀▀░│        ▀▀ ▀▀░│  └ ▀ ▀▀ ▀▀ ▀▀ ▀░┌─┘   ▀ ▀▀ ▀▀ ▀▀ ▀▀ ▀░┌──┘</text>

    <text class="ascii" x="0" y="80">  └──┘          └───┘  └───┘   └──────────────┘     └───┘   └──┘           └──┘        └──┘          └───┘        └──┘          └───┘     └───────────┘       └─────────────┘</text>

  </g>


  <!-- =====================================================
