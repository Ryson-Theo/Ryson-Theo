<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="340"
  viewBox="0 0 1200 340"
  fill="none"
  xml:space="preserve"
>
  <style>
    .terminal {
      fill: #080b10;
      stroke: #21262d;
      stroke-width: 1.5;
    }

    .topbar {
      fill: #0b0f14;
    }

    .prompt {
      font-family: "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #3fb950;
    }

    .path {
      font-family: "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 13px;
      fill: #8b949e;
    }

    .command {
      font-family: "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #c9d1d9;
    }

    .ascii {
      font-family:
        "SouthHeaven",
        "Courier New",
        "Liberation Mono",
        Consolas,
        monospace;
      font-size: 5.7px;
      font-weight: 700;
      fill: #58a6ff;
      white-space: pre;
      letter-spacing: 0;
      textLength: 1140px;
      lengthAdjust: spacingAndGlyphs;
      transform-origin: center;
      animation:
        asciiGlow 3.5s ease-in-out infinite,
        asciiFloat 6s ease-in-out infinite;
    }

    .description {
      font-family: "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      fill: #8b949e;
      letter-spacing: 0.1px;
    }

    .description-accent {
      fill: #58a6ff;
      font-weight: 700;
    }

    .header {
      font-family: "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #58a6ff;
    }

    .body {
      font-family: "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 10.5px;
      fill: #c9d1d9;
    }

    .muted {
      fill: #8b949e;
    }

    .accent {
      fill: #58a6ff;
      font-weight: 700;
    }

    .cursor {
      fill: #58a6ff;
      animation: cursorBlink 1s steps(1, end) infinite;
    }

    .divider {
      stroke: #21262d;
      stroke-width: 1;
    }

    @keyframes asciiGlow {
      0%, 100% {
        opacity: 0.82;
        filter: drop-shadow(0 0 0px #58a6ff);
      }

      45% {
        opacity: 1;
        filter: drop-shadow(0 0 4px #58a6ff);
      }

      55% {
        opacity: 0.94;
        filter: drop-shadow(0 0 1px #58a6ff);
      }
    }

    @keyframes asciiFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-0.8px);
      }
    }

    @keyframes cursorBlink {
      0%, 45% {
        opacity: 1;
      }

      46%, 100% {
        opacity: 0;
      }
    }
  </style>


  <!-- =====================================================
       LEFT TERMINAL
       ===================================================== -->

  <rect
    x="1"
    y="1"
    width="760"
    height="338"
    rx="12"
    class="terminal"
  />

  <rect
    x="2"
    y="2"
    width="758"
    height="38"
    rx="11"
    class="topbar"
  />

  <circle cx="25" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="21" r="6" fill="#27c93f"/>

  <text
    x="380"
    y="26"
    text-anchor="middle"
    font-family="Fira Code, JetBrains Mono, monospace"
    font-size="11"
    fill="#484f58"
  >
    Ryson-Theo — bash
  </text>


  <!-- LEFT COMMAND -->

  <g transform="translate(25 68)">

    <text class="prompt" x="0" y="0">
      Ryson-Theo@github
    </text>

    <text class="path" x="166" y="0">
      :~ $
    </text>

    <text class="command" x="215" y="0">
      whoami
    </text>

  </g>


  <!-- =====================================================
       ASCII NAME
       ===================================================== -->

