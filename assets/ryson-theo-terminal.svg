  </g>


  <!-- =====================================================
       PROFILE DESCRIPTION
       ===================================================== -->

  <g transform="translate(28 210)">

    <text
      class="output"
      x="0"
      y="0"
    >&gt; Specializing in AI/ML integration, scalable APIs,</text>

    <text
      class="output"
      x="0"
      y="21"
    >&gt; and intelligent systems across stacks.</text>

  </g>


  <!-- =====================================================
       ACTIVE TERMINAL
       ===================================================== -->

  <g transform="translate(28 282)">

    <text
      class="prompt"
      x="0"
      y="0"
    >Ryson-Theo@github</text>

    <text
      class="path"
      x="166"
      y="0"
