<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  fill="none"
  xml:space="preserve"
>
  <style>

    /* =====================================================
       TERMINAL
       ===================================================== */

    .terminal {
      fill: #080b10;
      stroke: #21262d;
      stroke-width: 1.5;
    }

    .topbar {
      fill: #0b0f14;
    }

    /* =====================================================
       TERMINAL TEXT
       ===================================================== */

    .prompt {
      font-family:
        "Fira Code",
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 14px;
      font-weight: 700;
      fill: #3fb950;
    }

    .path {
      font-family:
        "Fira Code",
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 14px;
      fill: #8b949e;
    }

    .command {
      font-family:
        "Fira Code",
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 14px;
      font-weight: 700;
      fill: #c9d1d9;
    }

    /* =====================================================
       ASCII NAME
       ===================================================== */

    .ascii {
      font-family:
        "SouthHeaven",
        "Courier New",
        "Liberation Mono",
        Consolas,
        monospace;

      font-size: 5.7px;
      font-weight: 700;

      fill: #58a6ff;

      white-space: pre;
      letter-spacing: 0;

      textLength: 1140px;
      lengthAdjust: spacingAndGlyphs;

      transform-origin: center;

      animation:
        asciiGlow 3.5s ease-in-out infinite,
        asciiFloat 6s ease-in-out infinite;
    }

    /* =====================================================
       DESCRIPTION
       ===================================================== */

    .description {
      font-family:
        "Fira Code",
        "JetBrains Mono",
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 12px;
      fill: #8b949e;
      letter-spacing: 0.15px;
    }

    .description-accent {
      fill: #58a6ff;
    }

    /* =====================================================
       CURSOR
       ===================================================== */

    .cursor {
      fill: #58a6ff;

      animation:
        cursorBlink 1s steps(1, end) infinite;
    }

    /* =====================================================
       ASCII ANIMATION
       ===================================================== */

    @keyframes asciiGlow {

      0% {
        opacity: 0.78;
        filter: drop-shadow(0 0 0px #58a6ff);
      }

      45% {
        opacity: 1;
        filter: drop-shadow(0 0 4px #58a6ff);
      }

      55% {
        opacity: 0.92;
        filter: drop-shadow(0 0 1px #58a6ff);
      }

      100% {
        opacity: 0.78;
        filter: drop-shadow(0 0 0px #58a6ff);
      }

    }

    @keyframes asciiFloat {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-1px);
      }

    }

    /* =====================================================
       CURSOR BLINK
       ===================================================== */

    @keyframes cursorBlink {

      0%,
      45% {
        opacity: 1;
      }

      46%,
      100% {
        opacity: 0;
      }

    }

    /* =====================================================
       SUBTLE CRT FLICKER
       ===================================================== */

    .screen-flicker {
      opacity: 0;
      animation: screenFlicker 7s infinite;
    }

    @keyframes screenFlicker {

      0%,
      91%,
      94%,
      100% {
        opacity: 0;
      }

      92% {
        opacity: 0.025;
      }

      93% {
        opacity: 0.01;
      }

    }

  </style>


  <!-- =====================================================
       TERMINAL WINDOW
       ===================================================== -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="298"
    rx="12"
    class="terminal"
  />


  <!-- =====================================================
       TERMINAL TOP BAR
       ===================================================== -->

  <rect
    x="2"
    y="2"
    width="1196"
    height="38"
    rx="11"
    class="topbar"
  />


  <!-- =====================================================
       MAC TERMINAL BUTTONS
       ===================================================== -->

  <circle
    cx="25"
    cy="21"
    r="6"
    fill="#ff5f56"
  />

  <circle
    cx="45"
    cy="21"
    r="6"
    fill="#ffbd2e"
  />

  <circle
    cx="65"
    cy="21"
    r="6"
    fill="#27c93f"
  />


  <!-- =====================================================
       TERMINAL TITLE
       ===================================================== -->

  <text
    x="600"
    y="26"
    text-anchor="middle"
    font-family="Fira Code, JetBrains Mono, monospace"
    font-size="11"
    fill="#484f58"
  >
    Ryson-Theo — bash
  </text>


  <!-- =====================================================
       WHOAMI COMMAND
       ===================================================== -->

  <g transform="translate(28 64)">

    <text
      class="prompt"
      x="0"
      y="0"
    >Ryson-Theo@github</text>

    <text
      class="path"
      x="166"
      y="0"
    >:~ $</text>

    <text
      class="command"
      x="215"
      y="0"
    >whoami</text>

  </g>


