<svg fill="none" viewBox="0 0 400 140" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 12px; }
    .title { font: bold 15px 'Segoe UI', Ubuntu, sans-serif; fill: #58a6ff; }
    .desc { font: 11px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    .badge-bg { fill: #238636; fill-opacity: 0.2; stroke: #2ea043; stroke-width: 1px; rx: 10px; }
    .badge-text { font: bold 10px 'Segoe UI', Ubuntu, sans-serif; fill: #3fb950; }
    .tech-lang { font: 11px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; }
    .stat-text { font: bold 11px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    .sparkline { stroke: #238636; stroke-width: 2; stroke-dasharray: 200; animation: dash 3s ease-in-out infinite alternate; }
    @keyframes dash { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
  </style>

  <!-- Card Frame -->
  <rect width="398" height="138" x="1" y="1" class="bg" />

  <!-- Project Icon (Sprout/Crop) -->
  <rect x="18" y="18" width="48" height="48" rx="10" fill="#161b22" stroke="#30363d" />
  <g transform="translate(28, 28)">
    <path d="M12 22V12M12 12C12 7.5 8.5 4 4 4C4 8.5 7.5 12 12 12ZM12 12C12 7.5 15.5 4 20 4C20 8.5 16.5 12 12 12Z" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Featured Badge -->
  <text x="76" y="32" class="title">CropVector</text>
  <rect x="322" y="18" width="62" height="20" class="badge-bg" />
  <text x="333" y="32" class="badge-text">Featured</text>

  <!-- Description -->
  <text x="76" y="52" class="desc">Agricultural intelligence decision engine for crop</text>
  <text x="76" y="67" class="desc">planning, NDVI satellite data &amp; price forecasts.</text>

  <!-- Tech Stack Tag & Details -->
  <circle cx="81" cy="105" r="4.5" fill="#61dafb" />
  <text x="92" y="108" class="tech-lang">React / Node.js</text>

  <path d="M170 101l1.2 2.5 2.8.4-2 2 .5 2.8-2.5-1.3-2.5 1.3.5-2.8-2-2 2.8-.4z" fill="none" stroke="#8b949e" stroke-width="1.2" />
  <text x="178" y="108" class="stat-text">MERN</text>

  <!-- Animated Chart Visual -->
  <path d="M270 95 Q285 80, 295 85 T320 70 T345 75 T370 55" fill="none" class="sparkline" />
</svg>
