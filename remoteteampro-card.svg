<svg fill="none" viewBox="0 0 420 150" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Global Styles */
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 12px; }
    .title { font: bold 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #58a6ff; }
    .desc { font: 12px/1.5 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #8b949e; }
    .badge-bg { fill: #1f6feb; fill-opacity: 0.15; stroke: #388bfd; stroke-width: 1px; rx: 10px; }
    .badge-text { font: bold 10px 'Segoe UI', sans-serif; fill: #58a6ff; }
    .tech-lang { font: 11px 'Segoe UI', sans-serif; fill: #c9d1d9; }
    .stat-text { font: bold 11px 'Segoe UI', sans-serif; fill: #8b949e; }
    
    /* Icon Animations */
    .node-rotate {
      animation: rotate-nodes 6s linear infinite;
      transform-origin: 46px 46px;
    }
    .core-pulse {
      animation: pulse-core 2s ease-in-out infinite alternate;
      transform-origin: 46px 46px;
    }
    .sparkline {
      stroke: #388bfd;
      stroke-width: 2;
      stroke-dasharray: 200;
      animation: dash 3.5s ease-in-out infinite alternate;
    }

    @keyframes rotate-nodes {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-core {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes dash {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Card Background -->
  <rect width="418" height="148" x="1" y="1" class="bg" />

  <!-- Animated Icon Container (Workforce Network Hub) -->
  <rect x="20" y="20" width="52" height="52" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <g>
    <!-- Central Hub Core -->
    <circle cx="46" cy="46" r="6" fill="#388bfd" class="core-pulse" />
    
    <!-- Rotating Team Connection Nodes -->
    <g class="node-rotate">
      <!-- Connection Lines -->
      <line x1="46" y1="46" x2="33" y2="35" stroke="#777bb4" stroke-width="1" opacity="0.6" />
      <line x1="46" y1="46" x2="59" y2="35" stroke="#777bb4" stroke-width="1" opacity="0.6" />
      <line x1="46" y1="46" x2="46" y2="60" stroke="#777bb4" stroke-width="1" opacity="0.6" />

      <!-- Nodes -->
      <circle cx="33" cy="35" r="3.5" fill="#777bb4" />
      <circle cx="59" cy="35" r="3.5" fill="#777bb4" />
      <circle cx="46" cy="60" r="3.5" fill="#3fb950" />
    </g>
  </g>

  <!-- Title & Featured Badge -->
  <text x="86" y="36" class="title">RemoteTeamPro</text>
  <rect x="338" y="20" width="62" height="20" class="badge-bg" />
  <text x="349" y="34" class="badge-text">Featured</text>

  <!-- Description with Proper Spacing -->
  <text x="86" y="58" class="desc">Workforce management platform with RBAC,</text>
  <text x="86" y="76" class="desc">automated attendance &amp; client reporting portals.</text>

  <!-- Footer Info & Tech Stack -->
  <g transform="translate(86, 118)">
    <!-- Tech Language -->
    <circle cx="4" cy="-4" r="4" fill="#777bb4" />
    <text x="14" y="0" class="tech-lang">PHP / MySQL</text>

    <!-- Stack Tag -->
    <path d="M110 -8 l1.2 2.5 2.8.4-2 2 .5 2.8-2.5-1.3-2.5 1.3.5-2.8-2-2 2.8-.4z" fill="none" stroke="#8b949e" stroke-width="1.2" />
    <text x="118" y="0" class="stat-text">LAMP</text>
  </g>

  <!-- Animated Sparkline Graph -->
  <path d="M285 95 Q300 105, 315 85 T345 100 T375 75 T400 60" fill="none" class="sparkline" />
</svg>
