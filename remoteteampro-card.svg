<svg fill="none" viewBox="0 0 600 200" width="600" height="200" xmlns="http://www.w3.org/2000/svg">

  <!-- Background Card (No Outline) -->
  <rect width="600" height="200" rx="16" fill="#0d1117" />

  <!-- LEFT ICON CONTAINER: Animated Remote Workforce Hub -->
  <rect x="28" y="28" width="72" height="72" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <g transform="translate(2, 2) scale(1.35)">
    <!-- Central Hub Core -->
    <circle cx="46" cy="46" r="6" fill="#388bfd">
      <animate attributeName="r" values="5.2; 6.8; 5.2" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.75; 1; 0.75" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Rotating Team Connection Nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 46 46" to="360 46 46" dur="6s" repeatCount="indefinite" />
      <line x1="46" y1="46" x2="33" y2="35" stroke="#777bb4" stroke-width="1" opacity="0.6" />
      <line x1="46" y1="46" x2="59" y2="35" stroke="#777bb4" stroke-width="1" opacity="0.6" />
      <line x1="46" y1="46" x2="46" y2="60" stroke="#777bb4" stroke-width="1" opacity="0.6" />

      <circle cx="33" cy="35" r="3.5" fill="#777bb4" />
      <circle cx="59" cy="35" r="3.5" fill="#777bb4" />
      <circle cx="46" cy="60" r="3.5" fill="#3fb950" />
    </g>
  </g>

  <!-- TITLE & BADGE -->
  <text x="120" y="52" fill="#79c0ff" font-family="sans-serif, Arial" font-weight="bold" font-size="24">RemoteTeamPro</text>
  
  <rect x="495" y="28" width="78" height="26" rx="13" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1" />
  <text x="508" y="45" fill="#58a6ff" font-family="sans-serif, Arial" font-weight="bold" font-size="12">Featured</text>

  <!-- DESCRIPTION -->
  <text x="120" y="88" fill="#c9d1d9" font-family="sans-serif, Arial" font-size="16">Workforce management platform with RBAC,</text>
  <text x="120" y="114" fill="#c9d1d9" font-family="sans-serif, Arial" font-size="16">automated attendance &amp; client reporting portals.</text>

  <!-- FOOTER TECH STACK -->
  <circle cx="125" cy="160" r="5.5" fill="#777bb4" />
  <text x="138" y="165" fill="#c9d1d9" font-family="sans-serif, Arial" font-size="14">PHP / MySQL</text>
  
  <path d="M 275 156 l 1.2 2.5 2.8 .4 -2 2 .5 2.8 -2.5 -1.3 -2.5 1.3 .5 -2.8 -2 -2 2.8 -.4 z" fill="none" stroke="#8b949e" stroke-width="1.2" />
  <text x="285" y="165" fill="#8b949e" font-family="sans-serif, Arial" font-weight="bold" font-size="14">LAMP</text>

  <!-- RIGHT VISUAL: System Metrics & Team Dashboard -->
  <g transform="translate(100, 22) scale(1.22)">
    <!-- Server Status Indicator -->
    <circle cx="382" cy="60" r="4" fill="#3fb950">
      <animate attributeName="r" values="3.2; 4.8; 3.2" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="382" cy="60" r="8" fill="none" stroke="#3fb950" stroke-width="1" stroke-dasharray="2 2" opacity="0.4" />

    <!-- Dashboard Baseline Horizon -->
    <line x1="312" y1="118" x2="392" y2="118" stroke="#30363d" stroke-width="1.5" />

    <!-- Animated Workforce Activity Waveform -->
    <rect x="320" y="98" width="4" height="20" rx="2" fill="#388bfd">
      <animate attributeName="height" values="6; 26; 6" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="112; 92; 112" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="328" y="92" width="4" height="26" rx="2" fill="#58a6ff">
      <animate attributeName="height" values="8; 28; 8" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="110; 90; 110" dur="0.9s" repeatCount="indefinite" />
    </rect>
    <rect x="336" y="103" width="4" height="15" rx="2" fill="#1f6feb">
      <animate attributeName="height" values="5; 22; 5" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="113; 96; 113" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="344" y="88" width="4" height="30" rx="2" fill="#388bfd">
      <animate attributeName="height" values="10; 30; 10" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="108; 88; 108" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="352" y="100" width="4" height="18" rx="2" fill="#777bb4">
      <animate attributeName="height" values="6; 24; 6" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="112; 94; 112" dur="1.4s" repeatCount="indefinite" />
    </rect>

    <!-- Terminal Status Outline (Mini Panel) -->
    <rect x="362" y="90" width="26" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="370" cy="97" r="1.5" fill="#3fb950" />
    <line x1="375" y1="97" x2="382" y2="97" stroke="#8b949e" stroke-width="1" stroke-linecap="round" />
    <line x1="368" y1="104" x2="382" y2="104" stroke="#58a6ff" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 1" />
  </g>
</svg>
